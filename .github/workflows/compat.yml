# The compatibility matrix: the Plugin Manager run inside Akai's MPC firmware under QEngine. Each machine in machines.json is split
# into shards (parallel jobs, balanced by timings.json); one page is made from all of them. Started by hand (Actions > compat > Run
# workflow) for each machine's smoke list in machines.json (suite full: every scenario), or on the schedule for the cells with no result
# on the code under test (target.json; plan.py rolling): none when the Manager and the installers have not changed. Every run adds its results to the ledger (ledger/, ledger.py) and remakes the page (docs/, report.py) from all of
# them, committed to main.
#
# A job starts from the machine's prebuilt image (images.yml; a private package) when one matches, otherwise it builds the instance
# and the machine snapshot itself (about 15 minutes more) and says so in the run's summary. The firmware is fetched only for that,
# from the private release in machines.json's firmware_repo with FIRMWARE_TOKEN, and checked against machines.json. Nothing built
# from it is cached or uploaded as an artifact: the artifacts hold summaries, screen captures, the Manager's own logs and, for a check
# that failed, the guest's log of MPC and the apply (journal-no-launch.txt, journal-end.txt).
name: compat

on:
  schedule:
    - cron: "23 */4 * * *"     # what changed since the last runs, if anything (plan.py rolling); nothing new, no jobs
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke: each machine's smoke list in machines.json; full: every scenario on every machine"
        type: choice
        options: [smoke, full]
        default: smoke
      plugin_manager:
        description: "Plugin Manager: owner/repo@ref (empty: target.json)"
        default: ""
      mpc_vst:
        description: "mpc-vst-plugins (installers): owner/repo@ref (empty: target.json)"
        default: ""
      qengine_ref:
        description: "QEngine commit (Peyton-C/QEngine; empty: target.json)"
        default: ""
      machines:
        description: "Instances from machines.json, space separated (empty: all)"
        default: ""
      scenarios:
        description: "Scenario names, space separated (empty: all). Fewer scenarios than shards: fewer jobs"
        default: ""
      rolling:
        description: "Only the cells with no result on the code under test, as the schedule does (machines still narrows it)"
        type: boolean
        default: false
      again:
        description: "With rolling: also rerun failed, flaky and the oldest cells when nothing is new"
        type: boolean
        default: false

concurrency:
  group: compat
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/mpc-compat-machine

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      any: ${{ steps.m.outputs.any }}
      plugin_manager: ${{ steps.m.outputs.plugin_manager }}
      mpc_vst: ${{ steps.m.outputs.mpc_vst }}
      qengine_ref: ${{ steps.m.outputs.qengine_ref }}
    steps:
      - uses: actions/checkout@v4
      # The refs pinned to commits here, so every job of the run tests the same code even if a branch moves meanwhile.
      - id: m
        env:
          PMS: ${{ inputs.plugin_manager }}
          VSTS: ${{ inputs.mpc_vst }}
          QREF: ${{ inputs.qengine_ref }}
          PICK: ${{ inputs.machines }}
          KS: ${{ inputs.scenarios }}
          SUITE: ${{ inputs.suite }}
          ROLLING: ${{ github.event_name == 'schedule' || inputs.rolling }}
          AGAIN: ${{ inputs.again }}
        run: |
          t() { python3 -c "import json;print(json.load(open('target.json'))['$1'])"; }
          pin() { sha=$(git ls-remote "https://github.com/${1%@*}" "${1#*@}" | awk 'NR==1{print $1}'); echo "${1%@*}@${sha:-${1#*@}}"; }
          PMS=$(pin "${PMS:-$(t plugin_manager)}"); VSTS=$(pin "${VSTS:-$(t mpc_vst)}"); QREF=${QREF:-$(t qengine)}
          if [ "$ROLLING" = true ]; then matrix=$(python3 plan.py rolling --pm "${PMS#*@}" --mpc-vst "${VSTS#*@}" --machines "$PICK" --explain $([ "$AGAIN" = true ] && echo --again))
          else matrix=$(python3 plan.py full --suite "${SUITE:-smoke}" --machines "$PICK" --scenarios "$KS"); fi
          { echo "plugin_manager=$PMS"; echo "mpc_vst=$VSTS"; echo "qengine_ref=$QREF"; echo "matrix=$matrix"
            echo "any=$(python3 -c 'import json,sys;print(str(bool(json.loads(sys.argv[1])["include"])).lower())' "$matrix")"; } >> "$GITHUB_OUTPUT"
          { echo "### Plan"; echo; echo "Plugin Manager \`$PMS\`, installers \`$VSTS\`, QEngine \`$QREF\`"; echo
            python3 -c 'import json,sys;[print("- %s %d/%d: %s (~%d s on a desktop)" % (j["instance"], j["shard"], j["of"], j["ks"], j["est"])) for j in json.loads(sys.argv[1])["include"]]' "$matrix"; } >> "$GITHUB_STEP_SUMMARY"

  build:
    # The Manager and the fixture (no firmware): built once, every shard downloads it.
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: compat }
      - name: Sources under test
        env:
          PMS: ${{ needs.plan.outputs.plugin_manager }}
          VSTS: ${{ needs.plan.outputs.mpc_vst }}
        run: |
          clone() { git clone -q --filter=blob:none "https://github.com/${1%@*}" "$2" && git -C "$2" checkout -q "${1#*@}"; }
          clone "$PMS" plugin-manager; clone "$VSTS" mpc-vst-plugins
          echo "BUILD_KEY=build-$(git -C plugin-manager rev-parse HEAD)-$(git -C mpc-vst-plugins rev-parse HEAD)" >> "$GITHUB_ENV"
      # The same two commits built before: the result is reused as it is (the Manager and the fixture only, no firmware).
      - id: built
        uses: actions/cache@v4
        with:
          path: compat/emu/build/fx/work
          key: ${{ env.BUILD_KEY }}
      - if: steps.built.outputs.cache-hit != 'true'
        uses: docker/setup-qemu-action@v3
        with: { platforms: "arm64,arm" }
      - name: Compiler images cache (public gcc images)
        if: steps.built.outputs.cache-hit != 'true'
        id: gcc
        uses: actions/cache@v4
        with:
          path: /tmp/gcc-images
          key: gcc-images-arm32v7-gcc11-bullseye-arm64v8-gcc12-bookworm-v1
      - name: Compiler images
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          if [ -f /tmp/gcc-images/gcc.tar ]; then docker load -q -i /tmp/gcc-images/gcc.tar; else
            docker pull -q --platform linux/arm/v7 arm32v7/gcc:11-bullseye && docker pull -q --platform linux/arm64 arm64v8/gcc:12-bookworm
            mkdir -p /tmp/gcc-images && docker save -o /tmp/gcc-images/gcc.tar arm32v7/gcc:11-bullseye arm64v8/gcc:12-bookworm; fi
      - name: Skin cache (the project's own artwork)
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: plugin-manager/vst/build
          key: skin-${{ hashFiles('plugin-manager/vst/layout.conf', 'plugin-manager/vst/skin.css', 'plugin-manager/vst/vst.json', 'plugin-manager/vst/params.json', 'plugin-manager/vst/make_*.py', 'plugin-manager/vst/skin_post.py', 'plugin-manager/vst/skin_taps.py', 'plugin-manager/vst/build_themes.sh', 'plugin-manager/vst/images/**') }}
      - name: Build
        if: steps.built.outputs.cache-hit != 'true'
        env:
          PM: ${{ github.workspace }}/plugin-manager
          MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
        run: compat/emu/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: manager-build
          path: compat/emu/build/fx/work
          retention-days: 3

  machine:
    needs: [plan, build]
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.instance }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-24.04
    environment: firmware   # holds FIRMWARE_TOKEN; only the default branch can use it
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PM: ${{ github.workspace }}/plugin-manager
      EMU: ${{ github.workspace }}/compat/emu
      PM_EMU_STATE: ${{ github.workspace }}/plugin-manager/tests/emu/state   # where the prebuilt images unpack
      MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
      QENGINE: ${{ github.workspace }}/QEngine
      FIRMWARE_DIR: /tmp/pm-firmware        # (job env cannot use the runner context)
      PM_FIRMWARE_SHA256: ${{ matrix.sha256 }}
      PM_PRODUCT_CODE: ${{ matrix.code }}
    steps:
      - uses: actions/checkout@v4
        with: { path: compat }
      - name: Sources under test
        env:
          PMS: ${{ needs.plan.outputs.plugin_manager }}
          VSTS: ${{ needs.plan.outputs.mpc_vst }}
          QREF: ${{ needs.plan.outputs.qengine_ref }}
        run: |
          clone() { git clone -q --filter=blob:none "https://github.com/${1%@*}" "$2" && git -C "$2" checkout -q "${1#*@}"; }
          clone "$PMS" "$PM"; clone "$VSTS" "$MPC_VST"; clone "Peyton-C/QEngine@$QREF" "$QENGINE"
          for d in "$PM" "$MPC_VST" "$QENGINE"; do echo "$(basename "$d") $(git -C "$d" rev-parse HEAD)"; done | tee sources.txt
          echo "PM_QENGINE_REF=$(git -C "$QENGINE" rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$FIRMWARE_DIR"     # before qe mounts it: Docker would make it, as root

      - name: Emulator host (prebuilt, else built here)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="host-$(sha256sum "$EMU/Dockerfile" | cut -c1-12)"
          if docker pull -q "$REGISTRY:$tag"; then docker tag "$REGISTRY:$tag" pm-emu-host; else docker build -q -t pm-emu-host "$EMU"; fi

      - id: img
        name: Machine (prebuilt image)
        run: |
          id=$("$EMU/qe" python3 "$EMU/machine.py" --id "${{ matrix.instance }}")
          ref="$REGISTRY:${{ matrix.instance }}-$id"
          if docker pull -q "$ref" 2>/dev/null; then
            c=$(docker create "$ref" x); docker cp "$c:/machine.tar.zst" - | tar -xOf - | zstd -dc | tar -C "$GITHUB_WORKSPACE" --sparse -xf -
            docker rm "$c" >/dev/null; docker rmi "$ref" >/dev/null
            echo "have=1" >> "$GITHUB_OUTPUT"; echo "${{ matrix.instance }} ${{ matrix.shard }}/${{ matrix.of }}: prebuilt machine $id" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No prebuilt image $ref: building the instance and the machine snapshot in this job (run the images workflow)"
            echo "${{ matrix.instance }} ${{ matrix.shard }}/${{ matrix.of }}: **no prebuilt image** for machine $id, built in the job" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.img.outputs.have != '1'
        uses: docker/setup-qemu-action@v3
        with: { platforms: "arm64,arm" }
      - name: Firmware (only without a prebuilt image)
        if: steps.img.outputs.have != '1'
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_TOKEN }}
        run: |
          mkdir -p "$FIRMWARE_DIR"
          repo=$(python3 -c 'import json;print(json.load(open("compat/machines.json"))["firmware_repo"])')
          gh release download images --repo "$repo" --pattern "${{ matrix.image }}" --dir "$FIRMWARE_DIR"
          echo "${{ matrix.sha256 }}  $FIRMWARE_DIR/${{ matrix.image }}" | sha256sum -c -
      - name: Instance (only without a prebuilt image; never cached)
        if: steps.img.outputs.have != '1'
        run: $EMU/qe scripts/build_scripts/new_instance.sh --name "${{ matrix.instance }}" --product-code "${{ matrix.code }}" --firmware "$FIRMWARE_DIR/${{ matrix.image }}"

      - name: The Manager and the fixture (from the build job)
        uses: actions/download-artifact@v4
        with: { name: manager-build, path: compat/emu/build/fx/work }

      - name: Scenarios (${{ matrix.ks }})
        run: |
          args=(-i "${{ matrix.instance }}"); for k in ${{ matrix.ks }}; do args+=(-k "$k"); done
          "$EMU/run.sh" "${args[@]}"

      - name: Results (no firmware files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.instance }}-${{ matrix.shard }}
          path: |
            compat/emu/results/${{ matrix.instance }}/**/summary.json
            compat/emu/results/${{ matrix.instance }}/**/*.png
            compat/emu/results/${{ matrix.instance }}/**/*.log
            compat/emu/results/${{ matrix.instance }}/**/*-result
            compat/emu/results/${{ matrix.instance }}/**/*-device.txt
            compat/emu/results/${{ matrix.instance }}/**/journal-no-launch.txt
            compat/emu/results/${{ matrix.instance }}/**/journal-end.txt
            compat/emu/results/${{ matrix.instance }}-*.log
            sources.txt
          retention-days: 30

  report:
    # This run's results into the ledger, the page remade from the whole ledger, both committed to main (Pages serves docs/). The page's
    # code under test is target.json's, whatever this run tested: a run of other code shows as other code on it.
    needs: [plan, machine]
    if: always() && needs.plan.outputs.any == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: art }
      - name: Ledger and page, onto main
        env:
          PMS: ${{ needs.plan.outputs.plugin_manager }}
          VSTS: ${{ needs.plan.outputs.mpc_vst }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN: gh-${{ github.run_id }}-${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
        run: |
          command -v convert >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q imagemagick; }    # shrinks the captures
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          t() { python3 -c "import json;print(json.load(open('target.json'))['$1'])"; }
          # Someone may push to main meanwhile: start again from it (adding to the ledger is idempotent) until the push goes in.
          for try in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 ledger.py add-art art --run "$RUN" --runner hosted --url "$URL" --pm-repo "${PMS%@*}" --mpc-vst-repo "${VSTS%@*}"
            python3 ledger.py prune-shots
            python3 report.py --ledger ledger --out docs --pm "$(t plugin_manager)" --mpc-vst "$(t mpc_vst)"
            git add -A ledger docs
            git diff --cached --quiet && { echo "nothing new"; break; }
            git commit -q -m "Results of $RUN ($EVENT)" && git push -q origin HEAD:main && break
            sleep $((try * 10))
          done
          { echo "### Compatibility"; echo; echo "Sources:"; cat art/*/sources.txt 2>/dev/null | sort -u | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json;d=json.load(open("docs/results.json"));c=d["cells"]
          print("Page: %d cells, %d failed, %d on the code under test" % (len(c), sum(x["ok"] is False for x in c), sum(x.get("current") is True for x in c)))' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compat-page
          path: docs
          retention-days: 30
