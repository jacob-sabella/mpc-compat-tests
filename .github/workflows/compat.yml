# The compatibility matrix: the Plugin Manager run inside Akai's MPC firmware under QEngine. Each machine in machines.json is split
# into shards (parallel jobs, balanced by timings.json); one page is made from all of them. Started by hand (Actions > compat > Run
# workflow) when the Manager or the installers change, or when new firmware comes out.
#
# A job starts from the machine's prebuilt image (images.yml; a private package) when one matches, otherwise it builds the instance
# and the machine snapshot itself (about 15 minutes more) and says so in the run's summary. The firmware is fetched only for that,
# from the private release in machines.json's firmware_repo with FIRMWARE_TOKEN, and checked against machines.json. Nothing built
# from it is cached or uploaded as an artifact: the artifacts hold summaries, screen captures and the Manager's own logs only.
name: compat

on:
  workflow_dispatch:
    inputs:
      plugin_manager:
        description: "Plugin Manager: owner/repo@ref"
        default: "jacob-sabella/plugin-manager@reliability-qengine"
      mpc_vst:
        description: "mpc-vst-plugins (installers): owner/repo@ref"
        default: "jacob-sabella/mpc-vst-plugins@fix/pm-reliability"
      qengine_ref:
        description: "QEngine commit (Peyton-C/QEngine)"
        default: "83a03e5"
      machines:
        description: "Instances from machines.json, space separated (empty: all)"
        default: ""
      scenarios:
        description: "Scenario names, space separated (empty: all). Fewer scenarios than shards: fewer jobs"
        default: ""

concurrency:
  group: compat
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/mpc-compat-machine

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Harness (the scenario list)
        env:
          PMS: ${{ inputs.plugin_manager }}
        run: git clone -q --filter=blob:none "https://github.com/${PMS%@*}" pm && git -C pm checkout -q "${PMS#*@}"
      - id: m
        env:
          PICK: ${{ inputs.machines }}
          KS: ${{ inputs.scenarios }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re
          ms = json.load(open("machines.json"))["machines"]
          times = json.load(open("timings.json"))["instances"]
          names = re.findall(r"^@scenario\ndef (\w+)", open("pm/tests/emu/scenarios.py").read(), re.M)
          pick, ks = os.environ["PICK"].split(), os.environ["KS"].split()
          for what, got, known in (("machines.json", pick, {m["instance"] for m in ms}), ("the harness's scenarios", ks, set(names))):
              if set(got) - known: raise SystemExit("not in %s: %s" % (what, " ".join(sorted(set(got) - known))))
          todo = ks or names
          inc = []
          for m in ms:
              if pick and m["instance"] not in pick: continue
              t = times.get(m["instance"]) or {}
              avg = sum(t.values()) / len(t) if t else 200
              total = sum(t.get(s, avg) for s in todo)        # a shard costs its setup too: at least ~400 s of scenarios each
              n = max(1, min(int(m.get("shards", 1)), len(todo), int(total // 400) or 1))
              shards = [[] for _ in range(n)]; load = [0] * n
              for s in sorted(todo, key=lambda s: -t.get(s, avg)):    # longest first, onto the least loaded shard
                  k = load.index(min(load)); shards[k].append(s); load[k] += t.get(s, avg)
              for k, sc in enumerate(shards):
                  inc.append(dict(m, shard=k + 1, of=n, ks=" ".join(sorted(sc, key=todo.index)), est=int(load[k])))
          print("matrix=" + json.dumps({"include": inc}))
          PY

  machine:
    needs: plan
    name: ${{ matrix.instance }} ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-24.04
    # FIRMWARE_TOKEN is a repository secret while this repository is private on GitHub Free (no environments there). In a public
    # repository, move it to an environment "firmware" restricted to the default branch and add: environment: firmware
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PM: ${{ github.workspace }}/plugin-manager
      MPC_VST: ${{ github.workspace }}/mpc-vst-plugins
      QENGINE: ${{ github.workspace }}/QEngine
      FIRMWARE_DIR: /tmp/pm-firmware        # (job env cannot use the runner context)
      PM_FIRMWARE_SHA256: ${{ matrix.sha256 }}
      PM_PRODUCT_CODE: ${{ matrix.code }}
    steps:
      - uses: actions/checkout@v4
        with: { path: compat }
      - name: Sources under test
        env:
          PMS: ${{ inputs.plugin_manager }}
          VSTS: ${{ inputs.mpc_vst }}
          QREF: ${{ inputs.qengine_ref }}
        run: |
          clone() { git clone -q --filter=blob:none "https://github.com/${1%@*}" "$2" && git -C "$2" checkout -q "${1#*@}"; }
          clone "$PMS" "$PM"; clone "$VSTS" "$MPC_VST"; clone "Peyton-C/QEngine@$QREF" "$QENGINE"
          for d in "$PM" "$MPC_VST" "$QENGINE"; do echo "$(basename "$d") $(git -C "$d" rev-parse HEAD)"; done | tee sources.txt
          echo "PM_QENGINE_REF=$(git -C "$QENGINE" rev-parse HEAD)" >> "$GITHUB_ENV"
          mkdir -p "$FIRMWARE_DIR"     # before qe mounts it: Docker would make it, as root

      - name: Emulator host (prebuilt, else built here)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="host-$(sha256sum "$PM/tests/emu/Dockerfile" | cut -c1-12)"
          if docker pull -q "$REGISTRY:$tag"; then docker tag "$REGISTRY:$tag" pm-emu-host; else docker build -q -t pm-emu-host "$PM/tests/emu"; fi

      - id: img
        name: Machine (prebuilt image)
        run: |
          id=$("$PM/tests/emu/qe" python3 "$PM/tests/emu/machine.py" --id "${{ matrix.instance }}")
          ref="$REGISTRY:${{ matrix.instance }}-$id"
          if docker pull -q "$ref" 2>/dev/null; then
            c=$(docker create "$ref" x); docker cp "$c:/machine.tar.zst" - | tar -xOf - | zstd -dc | tar -C "$GITHUB_WORKSPACE" --sparse -xf -
            docker rm -q "$c" >/dev/null; docker rmi -q "$ref" >/dev/null
            echo "have=1" >> "$GITHUB_OUTPUT"; echo "${{ matrix.instance }} ${{ matrix.shard }}/${{ matrix.of }}: prebuilt machine $id" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No prebuilt image $ref: building the instance and the machine snapshot in this job (run the images workflow)"
            echo "${{ matrix.instance }} ${{ matrix.shard }}/${{ matrix.of }}: **no prebuilt image** for machine $id, built in the job" >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: steps.img.outputs.have != '1'
        uses: docker/setup-qemu-action@v3
        with: { platforms: "arm64,arm" }
      - name: Firmware (only without a prebuilt image)
        if: steps.img.outputs.have != '1'
        env:
          GH_TOKEN: ${{ secrets.FIRMWARE_TOKEN }}
        run: |
          mkdir -p "$FIRMWARE_DIR"
          repo=$(python3 -c 'import json;print(json.load(open("compat/machines.json"))["firmware_repo"])')
          gh release download images --repo "$repo" --pattern "${{ matrix.image }}" --dir "$FIRMWARE_DIR"
          echo "${{ matrix.sha256 }}  $FIRMWARE_DIR/${{ matrix.image }}" | sha256sum -c -
      - name: Instance (only without a prebuilt image; never cached)
        if: steps.img.outputs.have != '1'
        working-directory: plugin-manager
        run: tests/emu/qe scripts/build_scripts/new_instance.sh --name "${{ matrix.instance }}" --product-code "${{ matrix.code }}" --firmware "$FIRMWARE_DIR/${{ matrix.image }}"

      - name: Build the Manager and the fixture
        working-directory: plugin-manager
        run: |
          [ -d vst/build/skin ] || vst/build_themes.sh armv7
          tests/emu/build.sh

      - name: Scenarios (${{ matrix.ks }})
        working-directory: plugin-manager
        run: |
          args=(-i "${{ matrix.instance }}"); for k in ${{ matrix.ks }}; do args+=(-k "$k"); done
          tests/emu/run.sh "${args[@]}"

      - name: Results (no firmware files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.instance }}-${{ matrix.shard }}
          path: |
            plugin-manager/tests/emu/results/${{ matrix.instance }}/**/summary.json
            plugin-manager/tests/emu/results/${{ matrix.instance }}/**/*.png
            plugin-manager/tests/emu/results/${{ matrix.instance }}/**/*.log
            plugin-manager/tests/emu/results/${{ matrix.instance }}/**/*-result
            plugin-manager/tests/emu/results/${{ matrix.instance }}/**/*-device.txt
            plugin-manager/tests/emu/results/${{ matrix.instance }}-*.log
            sources.txt
          retention-days: 30

  report:
    needs: machine
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Harness (for the scenario order and descriptions)
        env:
          PMS: ${{ inputs.plugin_manager }}
        run: git clone -q --filter=blob:none "https://github.com/${PMS%@*}" pm && git -C pm checkout -q "${PMS#*@}"
      - uses: actions/download-artifact@v4
        with: { pattern: results-*, path: art }
      - name: Page
        run: |
          python3 merge.py art results
          if ls results/*/work/summary.json >/dev/null 2>&1; then
            HARNESS=pm/tests/emu PM=pm python3 report.py --results results --machines machines.json --out site
          else
            echo "::warning::No machine produced results; no page. See the machine jobs."; mkdir -p site
          fi
          { echo "### Compatibility"; echo; echo "Sources:"; cat art/*/sources.txt 2>/dev/null | sort -u | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: compat-page
          path: site
          retention-days: 90
